[project]
name = "scenefork-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.23",
    "fastapi>=0.162.0",
    "jsonschema>=4.26.0",
    "meta-sam-parser>=0.1.0",
    "numpy>=2.5.4",
    "openai>=3.39.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
    "websockets>=15",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
